<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 180" role="img" aria-labelledby="aifbr-advisory-negative-title aifbr-advisory-negative-desc">
  <title id="aifbr-advisory-negative-title">AIFBR Advisory lockup negative</title>
  <desc id="aifbr-advisory-negative-desc">Negative AIFBR Advisory lockup for dark headers using the approved porcelain, champagne and copper palette.</desc>
  <defs>
    <style>
      .porcelain{fill:#f7f6f1}.champagne{fill:#d7b36a}.copper{fill:#c76542}.muted{fill:#f7f6f1;opacity:.2}.word{font-family:Aptos,"Segoe UI",Arial,sans-serif;font-weight:950;letter-spacing:0}.descriptor{font-family:Aptos,"Segoe UI",Arial,sans-serif;font-weight:760;letter-spacing:0}
    </style>
  </defs>
  <g>
    <rect x="28" y="28" width="124" height="124" rx="18" fill="none" stroke="#f7f6f1" stroke-opacity=".22" stroke-width="2"/>
    <rect class="champagne" x="42" y="42" width="24" height="24" rx="5"/>
    <rect class="champagne" x="78" y="42" width="24" height="24" rx="5"/>
    <rect class="muted" x="114" y="42" width="24" height="24" rx="5"/>
    <rect class="champagne" x="42" y="78" width="24" height="24" rx="5"/>
    <rect class="champagne" x="78" y="78" width="24" height="24" rx="5"/>
    <rect class="muted" x="114" y="78" width="24" height="24" rx="5"/>
    <rect class="champagne" x="42" y="114" width="24" height="24" rx="5"/>
    <rect class="muted" x="78" y="114" width="24" height="24" rx="5"/>
    <rect class="copper" x="114" y="114" width="24" height="24" rx="5"/>
  </g>
  <text x="184" y="111" font-size="66">
    <tspan class="word porcelain">AIFBR</tspan>
    <tspan class="descriptor champagne"> Advisory</tspan>
  </text>
